workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    environment:
      groups:
        - production
      node: "22"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install frontend dependencies
        script: npm ci --no-audit --no-fund
      - name: Build and verify iOS assets
        script: npm run build:ios-release
      - name: Sync iOS and install CocoaPods
        script: |
          set -euo pipefail
          npx --no-install cap sync ios
          node scripts/verify-api-embedded.mjs ios/App/App/public
      - name: Archive and package unsigned IPA
        script: |
          set -euo pipefail
          stage="$(mktemp -d)"
          output="$PWD/build/ios"
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$stage/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
          app="$stage/App.xcarchive/Products/Applications/App.app"
          test -f "$app/Info.plist"
          node scripts/verify-api-embedded.mjs "$app/public"
          mkdir -p "$stage/Payload" "$output"
          ditto "$app" "$stage/Payload/App.app"
          ditto -c -k --keepParent "$stage/Payload" "$output/jiuhe-unsigned.ipa"
          unzip -tq "$output/jiuhe-unsigned.ipa"
    artifacts:
      - build/ios/*.ipa
