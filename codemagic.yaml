workflows:
  ios-capacitor:
    name: iOS Capacitor Build
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      node: latest
      cocoapods: default
      vars:
        VITE_API_ORIGIN: "https://api.jiuhechuangtou.com"

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci --registry=https://registry.npmjs.org/

      - name: Build web application
        script: |
          node scripts/check-release-env.mjs
          npm run build
          node scripts/verify-api-embedded.mjs dist

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
          node scripts/verify-api-embedded.mjs ios/App/App/public

      - name: Install CocoaPods dependencies
        script: |
          pod install --project-directory=ios/App

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
