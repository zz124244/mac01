workflows:
  ios-capacitor:
    name: iOS Capacitor Build
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      node: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jiuhe.app

    scripts:
      - name: Install npm dependencies
        script: |
          npm config set registry https://registry.npmjs.org/
          npm ci --registry=https://registry.npmjs.org/

      - name: Build web application
        script: |
          npm run build

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          pod install --project-directory=ios/App

      - name: Set up signing profiles
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
